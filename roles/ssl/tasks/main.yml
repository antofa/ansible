---
- name: Install Certbot and Nginx plugin
  apt:
    name:
      - certbot
      - python3-certbot-nginx
    state: present

- name: Obtain SSL certificate
  command: >
    certbot --nginx
    -d {{ domain }}
    -d {{ domain_www }}
    --non-interactive
    --agree-tos
    -m {{ admin_email }}
    --redirect
  args:
    creates: "/etc/letsencrypt/live/{{ domain }}/fullchain.pem"
  notify: Reload nginx
